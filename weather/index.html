<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Weather Forecast</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;

    color: #e2e8f0;

.container {
    max-width: 1200px;

    background: #1e293b;
    border-radius: 12px;
}

.header-info h1 {
    color: #f1f5f9;
    font-weight: 700;
    margin: 0 0 10px 0;
    font-size: 32px;
}

.header-info .info-line {
    color: #cbd5e1;
    font-size: 18px;
    font-weight: 500;
    margin: 5px 0;
}

.input-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
    padding: 20px;
    background: #1e293b;
    border-radius: 12px;
    flex-wrap: wrap;
}

.input-group {
    display: flex;
    align-items: center;
    gap: 5px;
}

.input-group label {
    color: #f1f5f9;
    font-weight: 600;
    font-size: 16px;
    white-space: nowrap;
}

.input-group input {
    padding: 8px 12px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    border-radius: 8px;
    font-size: 16px;
    width: 100px;
    font-weight: 500;
}

.input-group select {
    padding: 8px 12px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
}

.update-button {
    padding: 8px 24px;
    background: #3b82f6;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}

.update-button:hover {
    background: #2563eb;
}

.loading-message {
    text-align: center;
    color: #3b82f6;
    font-size: 18px;
    font-weight: 600;
    padding: 20px;
    display: none;
}

.error-message {
    color: #ef4444;
    padding: 12px;
    background: #2e1f1f;
    border: 1px solid #7f1d1d;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 500;
    text-align: center;
    display: none;
}

.parameter-block {
    background: #1e293b;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
    overflow-x: auto;
}

.parameter-title {
    color: #f1f5f9;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 10px;
    padding: 10px;
    background: #334155;
    border-radius: 8px;
}

.weather-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

.weather-table th,
.weather-table td {
    text-align: center;
    padding: 8px 4px;
    border: 1px solid #475569;
    white-space: nowrap;
}

.weather-table th {
    background: #334155;
    color: #f1f5f9;
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 10;
}

.model-name {
    background: #475569;
    color: #f1f5f9;
    font-weight: 700;
    text-align: left;
    padding-left: 10px;
    position: sticky;
    left: 0;
    z-index: 5;
    min-width: 150px;
}

.date-header {
    background: #64748b;
    color: #f1f5f9;
    font-weight: 700;
}

.value-cell {
    font-size: 11px;
    font-weight: 500;
}

.temp-cell {
    font-weight: 500;
    font-size: 12px;
}

.precip-cell {
    font-weight: 500;
    font-size: 12px;
}

.wind-cell {
    font-weight: 500;
    font-size: 12px;
}

.prob-cell {
    font-weight: 500;
    font-size: 12px;
}

.sunshine-cell {
    font-weight: 500;
    font-size: 12px;
}

.no-data {
    color: #64748b;
    font-style: italic;
}
</style>
</head>

function getTemperatureColor(temp) {
    if (temp === null || temp === undefined || isNaN(temp)) {
        return { bg: '#1e293b', text: '#f1f5f9' };
    }
    
    for (let i = 0; i < TEMP_COLOR_MAP.length; i++) {
        if (temp >= TEMP_COLOR_MAP[i].temp) {
            const color = TEMP_COLOR_MAP[i].color;
            const rgb = parseInt(color.slice(1), 16);
            const r = (rgb >> 16) & 255;
            const g = (rgb >> 8) & 255;
            const b = rgb & 255;
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            const textColor = brightness > 128 ? '#000000' : '#ffffff';
            return { bg: color, text: textColor };
        }
    }
    
    return { bg: '#0A000A', text: '#ffffff' };
}

function formatDate(dateString) {
    const date = new Date(dateString);
    const day = date.getDate().toString().padStart(2, '0');
    const month = (date.getMonth() + 1).toString().padStart(2, '0');
    return `${day}.${month}`;
}

function formatSunshine(seconds) {
    if (seconds === null || seconds === undefined) return '-';
    const hours = Math.round(seconds / 3600);
    return hours.toString();
}

const API_CONFIG = {
  BASE_URL: 'https://isamegrelo.vercel.app/api/weather.php'
};

async function fetchAllModelsData(lat, lon) {
    const API_URL = `${API_CONFIG.BASE_URL}?lat=${lat}&lon=${lon}`;
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    loading.style.display = 'block';
    error.style.display = 'none';
    try {
        const response = await fetch(API_URL);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        loading.style.display = 'none';
        if (!data || !Array.isArray(data) || data.length === 0) {
            throw new Error('Invalid data format received');
        }
        return data[0];
    } catch (err) {
        loading.style.display = 'none';
        error.style.display = 'block';
        error.textContent = 'Error loading weather data: ' + err.message;
        console.error('Fetch error:', err);
        return null;
    }
}

function displayForecast(data, days) {
    if (!data || !data.daily) {
        console.error('No data to display');
        return;
    }
    const container = document.getElementById('forecastContainer');
    container.innerHTML = '';
    const dates = data.daily.time.slice(0, days);
    PARAMETERS.forEach(param => {
        const block = document.createElement('div');
        block.className = 'parameter-block';
        const title = document.createElement('div');
        title.className = 'parameter-title';
        title.textContent = param.label;
        block.appendChild(title);
        const table = document.createElement('table');
        table.className = 'weather-table';
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        const modelHeader = document.createElement('th');
        modelHeader.className = 'model-name';
        modelHeader.textContent = 'Model';
        headerRow.appendChild(modelHeader);
        dates.forEach(date => {
            const dateHeader = document.createElement('th');
            dateHeader.className = 'date-header';
            dateHeader.textContent = formatDate(date);
            headerRow.appendChild(dateHeader);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        MODELS.forEach(model => {
            const row = document.createElement('tr');
            const modelCell = document.createElement('td');
            modelCell.className = 'model-name';
            modelCell.textContent = model.name;
            row.appendChild(modelCell);
            const dataKey = `${param.key}_${model.key}`;
            if (data.daily[dataKey]) {
                const values = data.daily[dataKey].slice(0, days);
                values.forEach((value, index) => {
                    const cell = document.createElement('td');
                    cell.className = 'value-cell';
                    if (value !== null && value !== undefined && !isNaN(value)) {
                        if (param.type === 'temp') {
                            cell.textContent = value.toFixed(1);
                            cell.className += 'temp-cell';
                            const colors = getTemperatureColor(value);
                            cell.style.backgroundColor = colors.bg;
                            cell.style.color = colors.text;
                        } else if (param.type === 'wind') {
                            cell.textContent = (value / 3.6).toFixed(0);
                            cell.className += 'wind-cell';
                            const colors = getWindColor(value);
                            cell.style.backgroundColor = colors.bg;
                            cell.style.color = colors.text;
                        } else if (param.type === 'precip') {
                            cell.textContent = value.toFixed(0);
                            cell.className += 'precip-cell';
                            const colors = getPrecipitationColor(value);
                            cell.style.backgroundColor = colors.bg;
                            cell.style.color = colors.text;
                        } else if (param.type === 'prob') {
                            cell.textContent = Math.round(value);
                            cell.className += 'prob-cell';
                            const colors = getProbColor(value);
                            cell.style.backgroundColor = colors.bg;
                            cell.style.color = colors.text;
                        }
                          else if (param.type === 'sunshine') {
                            cell.textContent = formatSunshine(value);
                            cell.className += 'sunshine-cell';
                            const colors = getSunshineColor(value);
                            cell.style.backgroundColor = colors.bg;
                            cell.style.color = colors.text;
                        } else {
                            cell.textContent = Math.round(value);
                        }
                    } else {
                        cell.innerHTML = '<span class="no-data">-</span>';
                    }
                    row.appendChild(cell);
                });
                for (let i = values.length; i < days; i++) {
                    const cell = document.createElement('td');
                    cell.className = 'value-cell';
                    cell.innerHTML = '<span class="no-data">-</span>';
                    row.appendChild(cell);
                }
            } else {
                for (let i = 0; i < days; i++) {
                    const cell = document.createElement('td');
                    cell.className = 'value-cell';
                    cell.innerHTML = '<span class="no-data">-</span>';
                    row.appendChild(cell);
                }
            }
            tbody.appendChild(row);
        });
        table.appendChild(tbody);
        block.appendChild(table);
        container.appendChild(block);
    });
}

function updateLocationInfo(lat, lon) {
    document.getElementById('locationInfo').textContent = `${lat}°, ${lon}°`;
}


async function updateWeatherData() {
    const lat = parseFloat(document.getElementById('latInput').value);
    const lon = parseFloat(document.getElementById('lonInput').value);
    const days = 16;
    
    if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        const error = document.getElementById('error');
        error.style.display = 'block';
        error.textContent = 'Please enter valid latitude (-90 to 90) and longitude (-180 to 180) values.';
        return;
    }
    
    currentLat = lat;
    currentLon = lon;
    currentDays = days;
    
    updateLocationInfo(lat, lon);
    
    const data = await fetchAllModelsData(lat, lon);
    if (data) {
        displayForecast(data, days);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('latInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') updateWeatherData();
    });
    
    document.getElementById('lonInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') updateWeatherData();
    });
});
</script>
