<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPCC Precipitation</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Inter', sans-serif;
    background: #0a0a1a;
    color: #e2e8f0;
    padding: 0;
    margin: 0;
}

h1 {
    text-align: center;
    margin-bottom: 1rem;
}

.input-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
}

.input-row input {
    width: 80px;
    padding: 4px;
    border-radius: 4px;
    border: 1px solid #ccc;
    background: #1e1e2f;
    color: #e2e8f0;
}

.input-row input:focus {
    outline: none;
    border-color: #00d4ff;
}

button {
    padding: 5px 10px;
    border: none;
    border-radius: 5px;
    background: #00d4ff;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s ease;
}

button:hover {
    background: #4ecdc4;
}

.chart-container {
    max-width: 1200px;
    margin: 0 auto;
    height: 500px;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 12px;
    padding: 10px;
}
</style>
</head>
<body>
<h1>GPCC Precipitation Rolling 12-month Anomaly</h1>

<div class="input-row">
    <label>South:<input type="number" id="lat1" value="42.0"></label>
    <label>North:<input type="number" id="lat2" value="42.5"></label>
    <label>West:<input type="number" id="lon1" value="41.5"></label>
    <label>East:<input type="number" id="lon2" value="42.0"></label>
    <button id="fetchBtn">Load Data</button>
</div>

<div class="chart-container">
    <canvas id="chart"></canvas>
</div>

<script>
let chart;

function createEmptyChart() {
    const ctx = document.getElementById('chart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{
            label: 'Temperature Anomaly',
            data: [],
            borderColor: '#00d4ff',
            backgroundColor: 'rgba(0,212,255,0.1)',
            fill: true,
            borderWidth: 3,
            tension: 0,
            pointRadius: 0,
            pointHoverRadius: 0,
            pointBackgroundColor: '#00d4ff',
            pointBorderColor: '#ffffff',
            pointBorderWidth: 2,
            pointHoverBackgroundColor: '#ffffff',
            pointHoverBorderColor: '#00d4ff',
            pointHoverBorderWidth: 3
        }]},
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration:0 },
            scales: {
                x: {
                    type:'time',
                    time:{ parser: 'yyyy-MM-dd',unit: 'year',stepSize: 2,displayFormats: { year: 'yyyy' } },
                    ticks: { color:'#94a3b8', font:{size:14,family:'Inter',weight:'500'}, maxRotation:0, minRotation:0 },
                    grid:{ color:'rgba(148,163,184,0.1)' },
                    border:{ color:'rgba(148,163,184,0.2)' }
                },
                y: {
                    title:{ display:true, text:'mm', color:'#94a3b8', font:{size:14,family:'Inter',weight:'500'} },
                    ticks:{ color:'#94a3b8', font:{size:14,family:'Inter',weight:'500'} },
                    grid:{ color:'rgba(148,163,184,0.1)' },
                    border:{ color:'rgba(148,163,184,0.2)' }
                }
            },
            plugins:{
                legend:{ display:false },
                tooltip:{ callbacks:{ label: ctx => ` ${ctx.raw.y.toFixed(2)}°C` } }
            },
            interaction:{ intersect:false, mode:'index' }
        }
    });
}

async function fetchData(lat1, lat2, lon1, lon2) {
    const url = `https://isamegrelo.vercel.app/api/precipitation.php?lat1=${lat1}&lat2=${lat2}&lon1=${lon1}&lon2=${lon2}`;
    const res = await fetch(url);
    const json = await res.json();
    return json.data
        .filter(d=>parseFloat(d[1])!==-9999)
        .map(d=>({x:new Date(d[0]), y:parseFloat(d[1])}));
}

async function updateChart() {
    const lat1 = document.getElementById('lat1').value;
    const lat2 = document.getElementById('lat2').value;
    const lon1 = document.getElementById('lon1').value;
    const lon2 = document.getElementById('lon2').value;
    const dataPoints = await fetchData(lat1, lat2, lon1, lon2);
    chart.data.labels = dataPoints.map(p=>p.x);
    chart.data.datasets[0].data = dataPoints;
    chart.update();
}

createEmptyChart();
document.getElementById('fetchBtn').addEventListener('click', updateChart);
</script>
</body>
</html>
