<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relative Humidity</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<link rel="stylesheet" href="/heatmap/design.css" />
</head>
<body>
  <header>
    <h1>Relative Humidity Cross-Section</h1>

    <center>
      <label>Lat <input id="lat" type="number" step="0.1" value="42.5"></label>
      <label>Lon <input id="lon" type="number" step="0.1" value="41.9"></label>
      <label>Hours <input id="hours" type="number" step="1" min="120" max="384" value="240"></label>
      <button id="refresh">Refresh</button>
    </center>
    <span id="status"></span>
    
  </header>

  <div id="chart"></div>

  <script src="/heatmap/script.js"></script>
</body>
</html>
